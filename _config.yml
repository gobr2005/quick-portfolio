title: Michael Miller # your name (or website title) here
logo: "/images/Mike Miller.jpg?raw=true" # your photo (or logo) here
# Keep this short. The theme renders it in a fixed-position sidebar that does not
# scroll, so a long bio grows past the bottom of the screen and collides with the
# footer. It is also the homepage meta description, which search truncates around
# 155 characters. The full background lives in the About section of index.md.
description: > # your text below (remove <br> elements if you don't need line breaks)
  Husband, Father, Podcaster, Data Professional
  <br><br>
  I build end-to-end data reporting pipelines — Microsoft Fabric, Power BI, SQL, Python, and BigQuery.
  <br><br>
  <a href="https://www.linkedin.com/in/mikemiller117/">View My LinkedIn Profile</a>

theme: jekyll-theme-minimal
google_analytics: G-QSZL9GBWDF # your Google Analytics tracking ID here

# Fallback share image, so a link posted to LinkedIn gets a card instead of a bare
# text row. Pages with their own screenshot should override this with `image:` in
# their front matter — a page-specific preview always beats the profile photo.
defaults:
  - scope:
      path: ""
    values:
      image: /images/Mike%20Miller.jpg
